<script>
const BUILD_PRO=false;
/* Version gratuite : essai Pro de 7 jours, puis fonctions Pro verrouillées.
   Pro se débloque par un achat intégré Google Play (appli Android) ou par un code ami.
   La version Pro web (differe-malin-pro) reste en ligne pour les testeurs ; le transfert des réglages passe par un code à copier. */
const TRIAL_DAYS=7, FREE_CYCLES=3, PRICE_LABEL='2,99 €';
const STORE_URL='https://play.google.com/store/apps/details?id=fr.differemalin';
const K=BUILD_PRO?'dlp-':'dlf-';
function lsGet(k){try{return localStorage.getItem(K+k)}catch(e){return null}}
function lsSet(k,v){try{localStorage.setItem(K+k,v)}catch(e){}}
let trialStart=null;
if(!BUILD_PRO){const t=+lsGet('trial');if(t)trialStart=t;else{const n=Date.now();lsSet('trial',String(n));if(lsGet('trial'))trialStart=n}}
const trialLeft=()=>BUILD_PRO||!trialStart?0:Math.max(0,Math.ceil((trialStart+TRIAL_DAYS*864e5-Date.now())/864e5));
/* Codes amis : débloquent Pro dans la version gratuite (seules les empreintes SHA-256 sont dans le code) */
const UNLOCK_SALT='differe-malin:';
const UNLOCK_HASHES=["3d200e24e322976c4ecd0b7e9975f8181371c41fd55610764030105c31fb0628", "037d33eec4ad596c8222a24969b7bcd5b169a9f61755356c6c9d14af292305df", "d9daafe5267c7d9c094fbda1106236ad162ff1da9ae7d9d57b538fa658d295c4", "02dedca9230c2263371dbc3ffb4f100d1345bca2f7f4a5c5a2374c3051887732", "d07c37d749b0bc55fb5609f3f177fb235d184ebc953317811486483f6e0369dc", "59edcef45c8a23ce690ae32b6b437c263cf0e77db7d9dc79fb1019f2f2b2e7e6", "ef82d36973e72c80be055f2191879f27da260c43e1913887369dd231d922f61a", "60d7cef249539453beb6f8886056ec2a9c4b615dc3b3bb5cbe27a274a8eb76cc", "df8780438315c8a35ce8030c6256d6d233554b0cfff3469acd378962b7626caf", "2041363346f1cc3fb79fa15481876dd6ed62509271d73819683f1cf2669bb0b9", "83944df9cd1c4f0dd480a19bb88be45c7333da56daa4c2c607ce820f17e2435c", "ea0f3de1f1712da7b2ba5b82b7618c6d57a9a2baadbcd683c86ec9c2399db158", "4e84a6a5da67681f23c07fd4306ef26d9c912f1ec8241ca2ffa9f9e99aa95fec", "46230eb8149f37f6cd79eaca3b463ca9c162e684a95ecab6b834171b45b24ba2", "f484e42b31b34a8b84eeeff096e175bca5cc88d0ede7fdedb282b07db1ab0cdc", "42b2463998b8248501ad42a764d16945953164ae5c5a0024ac5b2b7975b0a4bd", "7a36c067bb1108653ea72a95f55170cedf46f092b71fd66f09ea9ec6a4754cd9", "c06854752117ac0c7fffa65557c3cca6543b896a86dfc15fd999f8d8d5635e57", "acd0aceb55c5f69f030e4f86c446f6106dd4982d7de868892a870cd0fd629647", "2b60ae91d968fb91c0a185d5abfb76820dc00b52234e8670e5026bcddde654e5"];
let unlocked=!BUILD_PRO&&lsGet('unlock')==='1';
/* Achat intégré Google Play (seulement dans l'appli Android installée depuis le Play Store).
   Le jeton d'achat est envoyé au petit serveur Applis Malines, qui le confirme auprès de Google
   (sans confirmation sous 3 jours, Google rembourse et retire l'achat). Rien d'autre n'est envoyé. */
const PLAY_BILLING='https://play.google.com/billing', PLAY_APP='fr.differemalin', PLAY_PRODUIT='pro';
const VERIF_URL=''; // adresse du serveur, ex. 'https://achats-applismalines.<compte>.workers.dev/verifier' (vide = achat désactivé)
let achete=lsGet('achat')==='1';
const pro=()=>BUILD_PRO||unlocked||achete||trialLeft()>0;
async function tryUnlock(code){code=(code||'').toUpperCase().replace(/\s/g,'');if(!code)return false;
  if(!(window.crypto&&crypto.subtle))throw new Error('nocrypto');
  const buf=await crypto.subtle.digest('SHA-256',new TextEncoder().encode(UNLOCK_SALT+code));
  const hex=[...new Uint8Array(buf)].map(b=>b.toString(16).padStart(2,'0')).join('');
  if(UNLOCK_HASHES.includes(hex)){unlocked=true;lsSet('unlock','1');return true}return false}
const SWATCHES=['#3a3eb4','#6c4bd8','#2f6fd6','#1f9bd1','#2b8a81','#3f9a3a','#9bb21e','#e0b31b','#cf7a26','#d4532b','#c8322b','#c23a7a','#7a5c4a','#5b627d'];
const TYPES={hsc:'Super creuses',hc:'Creuses',hp:'Pleines'};
const COLORS={bleu:'Bleu',blanc:'Blanc',rouge:'Rouge'};
const ALLDAY=['01/01','31/12'];
const OFFERS={
  'zen-estival':{label:'EDF Zen Estival',note:'Horaires et prix TTC 6 kVA vérifiés au 1er novembre 2026.',tempo:false,seasons:[
    {name:'Hiver',from:'01/11',to:'31/03',hsc:[['22:00','07:00']],hc:[['11:00','18:00']],hp:[['07:00','11:00'],['18:00','22:00']],price:{hsc:0.1992,hc:0.2131,hp:0.2722}},
    {name:'Été',from:'01/04',to:'31/10',hsc:[['11:00','18:00']],hc:[['22:00','07:00']],hp:[['07:00','11:00'],['18:00','22:00']],price:{hsc:0.0991,hc:0.1405,hp:0.1588}}]},

    ${sel?`<div class="tl-cyc" style="${cycStyle(sel,now,SPAN,DRAG.ctx)}" role="img" aria-label="Ton cycle"></div>`:''}
    <div class="tl-ticks">${ticks}</div></div>

    ${sel?`<div class="row between" style="margin-top:6px"><p class="note" style="flex:1;min-width:12em">Fais glisser le cadre : tu vois la plage${pro()?' et le coût':''} du créneau.</p>${ui.pick!=null?`<button class="btn small" data-pickreset>Meilleur créneau</button>`:''}</div>`:''}</div>`}
/* Glisser le cadre : il se pose sur n'importe quel réglage possible, la plage et le prix se mettent à jour */
const DRAG={ctx:null,on:false,live:null,el:null};
function dragAt(e){const c=DRAG.ctx,tl=DRAG.el;if(!c||!tl)return;
  const rc=tl.getBoundingClientRect(),x=Math.min(1,Math.max(0,(e.clientX-rc.left)/rc.width));
  const want=c.now+x*c.span-c.cyc.dur*6e4/2;let best=c.all[0];for(const r of c.all)if(Math.abs(r.st-want)<Math.abs(best.st-want))best=r;
  if(!best||DRAG.live===best)return;DRAG.live=best;
  const f=tl.querySelector('.tl-cyc');if(f)f.setAttribute('style',cycStyle(best,c.now,c.span,c));
  const hr=document.getElementById('hero');if(hr)hr.innerHTML=heroInner(best,c.ap,c.cyc,c.now,c.bestCost)}
app.addEventListener('pointerdown',e=>{const tl=e.target.closest('[data-tl]');if(!tl||!DRAG.ctx||!DRAG.ctx.all.length||!tl.querySelector('.tl-cyc'))return;
  DRAG.on=true;DRAG.live=null;DRAG.el=tl;tl.classList.add('dragging');try{tl.setPointerCapture(e.pointerId)}catch(_){}dragAt(e)});
app.addEventListener('pointermove',e=>{if(DRAG.on)dragAt(e)});
function dragEnd(keep){if(!DRAG.on)return;DRAG.on=false;if(keep&&DRAG.live){ui.pick=DRAG.live.k;ui.endPref='latest'}DRAG.live=null;render()}
app.addEventListener('pointerup',()=>dragEnd(true));app.addEventListener('pointercancel',()=>dragEnd(false));
app.addEventListener('toggle',e=>{if(e.target&&e.target.id==='opts')ui.optsOpen=e.target.open},true);

function renderCalc(){

  if(!ap){app.innerHTML=h+`<p class="alert">Ajoute un appareil dans l'onglet Appareils.</p>`;return}

  if(sel){h+=`<div class="hero" id="hero">${heroInner(sel,ap,cyc,now,cs_.bestCost)}</div>`}
  else{
    let msg='',found=null;const longest=Math.max(0,...ws.map(w=>(w.e-w.s)/6e4));
    if(!ws.length)msg=`Ton offre n'a pas d'heures ${TYPES[S.target]?TYPES[S.target].toLowerCase():'creuses'} sur cette période. Choisis une autre plage dans les options.`;
    else if(longest<cyc.dur+2*S.margin)msg=`Ce cycle (${fDur(cyc.dur)}) est plus long que ${targetLbl()} (${fDur(Math.round(longest))}).`;
    else{const ws2=windows(now,5);for(let t=now+5*6e4;t<now+48*36e5;t+=5*6e4){if(candidates(t,cyc.dur,ap,ws2).length){found=t;break}}
      msg=`Aucun différé entre ${ap.minDelay} h et ${ap.maxDelay} h ne fait tenir ce cycle dans ${targetLbl()}.`+(found?` Possible à partir de ${fT(found)} (${esc(dayLbl(found,now))}).`:'')}
    h+=`<div class="hero off"><span class="lbl">Différé à régler</span><div class="big">--<small>h</small></div></div><p class="alert">${msg}</p>`;

    if(pro()){

      else if(ec)h+=`<div class="year"><span class="note">Si tu fais pareil à chaque fois</span><div class="amt">${ap_}${eur(ec.saving*cpy.n)} <span style="font-size:.55em">par an</span></div>

    if(pro()&&ec&&ec.saving>=0.005)h+=`<p class="note">Ce cycle : ${ap_}${eur(ec.cost)} au lieu de ${ap_}${eur(ec.peak)}, soit ${Math.round(ec.saving/ec.peak*100)} % de moins · ${fK(ec.kwh)} kWh, ${srcT}${S.tempo?' · jour '+(tempoColor(sel.st)?COLORS[tempoColor(sel.st)].toLowerCase():'bleu (supposé)'):''}</p>`;

  h+=`<details class="opts" id="opts"${ui.optsOpen?' open':''}><summary>Options du calcul</summary><div class="inner">
    <span class="eyebrow">Heure de référence</span>

      ${ui.endPref==='target'?`<input type="time" id="endAt" value="${esc(ui.endAt)}" aria-label="Heure de fin souhaitée">`:''}</div>`;
  if(res.length>1){const L=[...res].reverse();const show=sel&&sel.launch?L.filter((r,i)=>i%6===0||(sel&&r.k===sel.k)):L;
    h+=`<span class="eyebrow">Autres réglages possibles (du plus tardif au plus tôt)</span><div class="chips">${show.map(r=>`<button class="chip" data-pick="${r.k}" aria-pressed="${!!sel&&r.k===sel.k}">${r.launch?fT(r.st):fDur(r.k)} <span class="muted" style="font-size:.8em">fin ${fT(r.en)}</span></button>`).join('')}</div>`}
  if(sel&&sel.w)h+=`<p class="note">Plage ${TYPES[sel.w.type].toLowerCase()} ${fT(sel.w.s)} → ${fT(sel.w.e)}, marge de ${S.margin} min de chaque côté.</p>`;
  h+=`</div></details>`;
  if(!pro())h+=proCard();
  app.innerHTML=h;
}

/* Projection sur un an : meilleur créneau de chaque appareil (cycle favori) x rythme annuel */
function yearProjection(){const now=Date.now();let tot=0,n=0;
  for(const a of A){const c=a.cycles.find(x=>x.fav)||a.cycles[0];if(!c)continue;const best=prefer(candidates(now,c.dur,a,windows(now)));if(!best)continue;
    const ec=economics(c,best,a);if(ec&&ec.saving>0){tot+=ec.saving*cyclesPerYear(a).n;n++}}
  return n?tot:null}

  if(!H.length)h+=`<div class="panel"><p class="note">Aucun cycle enregistré. Après avoir programmé la machine, touche « J'ai lancé ce cycle » dans l'onglet Différé.</p></div>`;

  app.innerHTML=h;

  <div class="panel"><h2>Lancer les programmes en heures</h2>${targetSeg()}<p class="note">Auto vise les heures super creuses si ton offre en a, sinon les heures creuses. Ce choix se retrouve aussi sur l'écran Différé.</p></div>
  <div class="panel"><h2>Offre d'électricité</h2>
    <select id="offer" aria-label="Offre">${Object.entries(OFFERS).map(([k,o])=>`<option value="${k}"${S.offerId===k?' selected':''}${o.pro&&!pro()?' disabled':''}>${o.label}${o.pro&&!pro()?' (Pro)':''}</option>`).join('')}</select>
    <p class="note">${esc(off.note)} Changer d'offre remplace les plages ci-dessous.</p>
    <label class="field">Marge de sécurité (min)<input type="number" id="margin" min="0" max="60" value="${S.margin}"></label>
    <p class="note">Le compteur bascule parfois quelques minutes avant ou après l'horaire annoncé, et la durée d'un cycle varie selon la charge.</p></div>`;
  if(S.tempo&&pro()){h+=`<div class="panel"><h2>Prix Tempo (€/kWh)</h2><div class="list">${Object.keys(COLORS).map(c=>`<div class="range"><span class="tpill tp-${c}" style="min-width:4.5em;text-align:center">${COLORS[c]}</span>
    creuses ${priceInput('tp-'+c+'-hc',`data-tp="${c}|hc"`,S.tempoPrices[c].hc)} pleines ${priceInput('tp-'+c+'-hp',`data-tp="${c}|hp"`,S.tempoPrices[c].hp)}</div>`).join('')}</div>
    <p class="note">La couleur du jour est récupérée automatiquement quand le réseau le permet.</p></div>`}
  S.seasons.forEach((s,si)=>{
    h+=`<div class="panel"><div class="row between"><input id="sn-${si}" data-sname="${si}" value="${esc(s.name)}" style="font-weight:700;flex:1" aria-label="Nom de la période">${S.seasons.length>1?`<button class="icon-btn" data-sdel="${si}" aria-label="Supprimer la période">✕</button>`:''}</div>
      <div class="grid2"><label class="field">Du (jj/mm)<input id="sf-${si}" data-sfrom="${si}" value="${esc(s.from)}"></label>
      <label class="field">Au (jj/mm)<input id="st-${si}" data-sto="${si}" value="${esc(s.to)}"></label></div>`;
    for(const ty of ['hsc','hc','hp']){
      h+=`<div class="group"><h3><span class="dot t-${ty}"></span>Heures ${TYPES[ty].toLowerCase()}${!S.tempo?`<span style="margin-left:auto" class="${pro()?'':'locked'}">${priceInput(`p-${si}-${ty}`,`data-price="${si}|${ty}"`,s.price&&s.price[ty],!pro())}</span>`:''}</h3>`;
      (s[ty]||[]).forEach((r,ri)=>{h+=`<div class="range"><input type="time" id="r-${si}-${ty}-${ri}-0" data-r="${si}|${ty}|${ri}|0" value="${esc(r[0])}" aria-label="Début"> à <input type="time" id="r-${si}-${ty}-${ri}-1" data-r="${si}|${ty}|${ri}|1" value="${esc(r[1])}" aria-label="Fin"><button class="icon-btn" data-rdel="${si}|${ty}|${ri}" aria-label="Supprimer la plage">✕</button></div>`});
      h+=`<button class="btn small" style="align-self:flex-start" data-radd="${si}|${ty}">+ plage</button></div>`;
    }
    h+=`</div>`;
  });
  h+=`<button class="btn" data-sadd>Ajouter une période</button>
  <p class="note">L'appli vise les heures super creuses quand l'offre en a, sinon les heures creuses. ${pro()?'':'Les prix et les économies sont dans la version Pro.'} Les réglages restent sur ce téléphone.</p>`;
  h+=renderUnlock()+renderColors()+renderTransfer();
  h+=`<button class="btn danger" data-reset>${ui.resetArmed?'Confirmer : tout remettre par défaut':'Tout remettre par défaut'}</button>`;
  app.innerHTML=h;
}

function renderColors(){
  if(!pro())return `<div class="panel locked"><div class="row"><h2>Couleurs des plages</h2>${proTag()}</div><p class="note">Choisis la couleur des heures super creuses, creuses et pleines.</p></div>`;
  const cs=getComputedStyle(document.documentElement);
  let h=`<div class="panel"><div class="row between"><h2>Couleurs des plages</h2><button class="btn small" data-colreset>Couleurs d'origine</button></div>`;
  for(const ty of ['hsc','hc','hp']){const cur=(S.colors[ty]||cs.getPropertyValue('--'+ty).trim()).toLowerCase();
    h+=`<div class="group"><h3><span class="dot t-${ty}"></span>Heures ${TYPES[ty].toLowerCase()}</h3>
      <div class="swatches" role="group" aria-label="Couleur des heures ${TYPES[ty].toLowerCase()}">${SWATCHES.map(c=>`<button class="sw" data-col="${ty}|${c}" style="background:${c}" aria-pressed="${cur===c}" aria-label="${c}"></button>`).join('')}
      <label class="sw sw-free" title="Autre couleur"><input type="color" id="colp-${ty}" data-colpick="${ty}" value="${/^#[0-9a-f]{6}$/.test(cur)?cur:'#3a3eb4'}" aria-label="Autre couleur">+</label></div></div>`}
  return h+`<p class="note">Ces couleurs s'appliquent à la frise, aux pastilles et à la légende.</p></div>`}

function renderUnlock(){if(BUILD_PRO)return '';
  if(achete)return `<div class="panel"><div class="row"><h2>Version Pro</h2>${proTag()}</div><p class="note">Achetée sur Google Play : elle revient toute seule sur tes autres téléphones Android avec le même compte Google. Merci !</p></div>`;
  if(unlocked)return `<div class="panel"><div class="row"><h2>Code ami</h2>${proTag()}</div><p class="note">Version Pro débloquée sur ce téléphone.</p></div>`;
  return `<div class="panel"><div class="row"><h2>Code ami</h2>${proTag()}</div><p class="note">Tu as reçu un code ? Il débloque toutes les fonctions Pro sur ce téléphone.</p>
  <div class="row"><input id="unlockBox" placeholder="AMI-XXXXX" autocapitalize="characters" autocomplete="off" style="flex:1;font-family:var(--mono);text-transform:uppercase"><button class="btn primary" data-unlock>Débloquer</button></div>
  ${ui.unlockMsg?`<p class="note">${esc(ui.unlockMsg)}</p>`:''}</div>`}
function renderTransfer(){if(!BUILD_PRO&&ui.achatDispo)return ''; // dans l'appli Play, la Pro est un achat intégré : rien à transférer
  let h=`<div class="panel"><h2>Transférer mes réglages</h2><p class="note">${BUILD_PRO?'Colle ici le code copié depuis la version gratuite pour récupérer tes cycles, horaires et historique.':'Copie ce code puis colle-le dans Différé Malin Pro (Réglages) pour retrouver tes cycles, horaires et historique.'}</p>`;
  if(!BUILD_PRO)h+=`<div class="row"><button class="btn" data-export>Copier le code</button>${ui.exportMsg?`<span class="note">${esc(ui.exportMsg)}</span>`:''}</div>${ui.exportShow?`<textarea id="exportBox" readonly rows="3" style="width:100%;font:12px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px">${esc(exportCode())}</textarea>`:''}`;
  else h+=`<textarea id="importBox" rows="3" placeholder="Colle le code ici" style="width:100%;font:12px var(--mono);color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px"></textarea>
    <div class="row"><button class="btn" data-import>Importer</button>${ui.importMsg?`<span class="note">${esc(ui.importMsg)}</span>`:''}</div>`;
  return h+`</div>`}
function exportCode(){const json=JSON.stringify({v:1,S,A,H});return 'DL1:'+btoa(unescape(encodeURIComponent(json)))}
function importCode(code){const m=/DL1:([A-Za-z0-9+/=]+)/.exec((code||'').replace(/\s/g,''));if(!m)throw new Error('format');
  const o=JSON.parse(decodeURIComponent(escape(atob(m[1]))));if(!o.S||!Array.isArray(o.A))throw new Error('format');
  S=o.S;if(!S.colors)S.colors={hsc:null,hc:null,hp:null};if(!S.theme)S.theme='auto';if(!S.target)S.target='auto';applyTheme();
  A=o.A;migrateAppl();H=Array.isArray(o.H)?o.H:[];ui.applId=A[0]&&A[0].id;save();applyColors()}

const tabsEl=document.getElementById('tabs');
function render(){
  const TABS=[['calc','Différé'],['appl','Appareils'],['hist','Économies'],['settings','Réglages']];
  tabsEl.innerHTML=TABS.map(([k,l])=>`<button data-tab="${k}" aria-current="${k===ui.tab?'page':'false'}">${l}</button>`).join('');
  ({calc:renderCalc,appl:renderAppl,hist:renderHist,settings:renderSettings})[ui.tab]();
}
tabsEl.addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;ui.tab=b.dataset.tab;ui.resetArmed=false;render();window.scrollTo(0,0)});

const P=s=>s.split('|');
app.addEventListener('click',e=>{const t=e.target.closest('button');if(!t)return;const d=t.dataset;
  if(d.tm){ui.timeMode=d.tm;if(d.tm==='manual'&&!ui.mDate){const n=Date.now();ui.mDate=ymd(n);ui.mTime=fT(n)}render()}
  else if(d.appl){ui.applId=d.appl;ui.cycleId=null;ui.pick=null;render()}
  else if(d.cyc){ui.cycleId=d.cyc;ui.pick=null;render()}
  else if(d.ep){ui.endPref=d.ep;ui.pick=null;render()}
  else if(d.pick){ui.pick=+d.pick;render()}
  else if(d.pickreset!==undefined){ui.pick=null;ui.endPref='latest';render()}
  else if(d.tabGo){ui.tab=d.tabGo;ui.resetArmed=false;render();window.scrollTo(0,0)}
  else if(d.tman){const[dd,c]=P(d.tman);setTempoManual(dd,c);render()}
  else if(d.col){const[ty,c]=P(d.col);S.colors[ty]=c;save();applyColors();render()}
  else if(d.labsave){const ai=+d.labsave,a=A[ai];a.label=a.label||{};
    const k=num(document.getElementById('lk-'+ai).value),du=parseDur(document.getElementById('ld-'+ai).value);
    if(!(k>0)||!(du>0)){ui.qrMsg={ai,t:'Indique la consommation pour 100 cycles et la durée, par exemple 49 et 3:28.'};render();return}
    a.label.k100=k;a.label.dur=du;let c=a.cycles.find(isLabel);
    if(!c){c=mkC(labelCycleName(a),du,k/100);c.source='label';a.cycles.unshift(c)}else{c.dur=du;c.kwh=k/100;c.name=labelCycleName(a)}
    ui.qrMsg={ai,t:'Programme officiel enregistré : '+fK(k/100)+' kWh par cycle, '+fDur(du)+'.'};save();render()}
  else if(d.target){S.target=d.target;ui.pick=null;save();render()}
  else if(d.themeSet){S.theme=d.themeSet;save();applyTheme();render()}
  else if(d.colreset!==undefined){S.colors={hsc:null,hc:null,hp:null};save();applyColors();render()}
  else if(d.export!==undefined){const code=exportCode();ui.exportShow=true;
    const done=m=>{ui.exportMsg=m;render()};
    try{navigator.clipboard.writeText(code).then(()=>done('Code copié.'),()=>done('Sélectionne le code ci-dessous et copie-le.'))}catch(e){done('Sélectionne le code ci-dessous et copie-le.')}}
  else if(d.import!==undefined){try{importCode(document.getElementById('importBox').value);ui.importMsg='Réglages importés.'}catch(e){ui.importMsg='Code non reconnu : copie-le en entier depuis la version gratuite.'}render()}
  else if(d.log){const now=getNow(),ap=curAppl(),cyc=curCycle(ap);
    const sel=currentSel(now,ap,cyc).sel;if(!sel)return;const ec=economics(cyc,sel,ap);
    H.push({id:'h'+Date.now(),t:sel.st,at:Date.now(),en:sel.en,ap:ap.id,cid:cyc.id,appl:ap.name,cycle:cyc.name,est:!isLabel(cyc),kwh:ec?ec.kwh:cycKwh(ap,cyc),cost:ec?ec.cost:null,saving:ec?ec.saving:null});save();
    try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}render()}
  else if(d.unlog){H=H.filter(x=>x.id!==d.unlog);save();render()}
  else if(d.hdel){H=H.filter(x=>x.id!==d.hdel);save();render()}
  else if(d.fav){const[ai,ci]=P(d.fav).map(Number),cs=A[ai].cycles,was=cs[ci].fav;cs.forEach(c=>c.fav=false);cs[ci].fav=!was;save();render()}
  else if(d.cdel){const[ai,ci]=P(d.cdel).map(Number);A[ai].cycles.splice(ci,1);save();render()}
  else if(d.cadd&&(pro()||A[+d.cadd].cycles.length<FREE_CYCLES)){A[+d.cadd].cycles.push(mkC('Nouveau cycle',60,null));save();render()}
  else if(d.aadd!==undefined&&pro()){A.push({id:'a'+Date.now(),name:'Nouvel appareil',power:0.5,mode:'start',minDelay:1,maxDelay:24,step:60,noDelay:false,cycles:[mkC('Cycle',60,null,true)]});save();render()}
  else if(d.adel&&pro()){A.splice(+d.adel,1);if(!A.find(a=>a.id===ui.applId))ui.applId=A[0]&&A[0].id;save();render()}
  else if(d.amode){const[ai,m]=P(d.amode);A[+ai].mode=m;save();render()}
  else if(d.radd){const[si,ty]=P(d.radd);(S.seasons[+si][ty]=S.seasons[+si][ty]||[]).push(['00:00','01:00']);S.offerId='custom';save();render()}
  else if(d.rdel){const[si,ty,ri]=P(d.rdel);S.seasons[+si][ty].splice(+ri,1);S.offerId='custom';save();render()}
  else if(d.sadd!==undefined){S.seasons.push({name:'Nouvelle période',from:'01/01',to:'31/12',hsc:[],hc:[],hp:[],price:{hsc:null,hc:null,hp:null}});S.offerId='custom';save();render()}
  else if(d.sdel){S.seasons.splice(+d.sdel,1);S.offerId='custom';save();render()}
  else if(d.reset!==undefined){if(ui.resetArmed){S=clone(DEF_SETTINGS);A=clone(DEF_APPL);ui.applId=A[0].id;ui.resetArmed=false;save();applyTheme();applyColors()}else ui.resetArmed=true;render()}
});

app.addEventListener('change',e=>{const t=e.target,d=t.dataset;
  if(d.qr&&t.files&&t.files[0]){scanQR(+d.qr,t.files[0]);return}
  if(d.lreg){const a=A[+d.lreg];a.label=a.label||{};const r=parseReg(t.value);a.label.reg=r;ui.qrMsg=r?null:{ai:+d.lreg,t:'Numéro non reconnu : colle le lien complet du QR code ou le numéro de la fiche.'};save();render();return}
  if(t.id==='mDate'){ui.mDate=t.value;render();return}
  if(t.id==='mTime'){ui.mTime=t.value;render();return}
  if(t.id==='endAt'){ui.endAt=t.value;ui.pick=null;render();return}
  if(d.colpick){S.colors[d.colpick]=t.value;save();applyColors();render();return}
  if(t.id==='margin'){S.margin=Math.max(0,+t.value||0);save();return}
  if(t.id==='offer'){const o=OFFERS[t.value];if(!o||(o.pro&&!pro()))return;S.offerId=t.value;S.tempo=!!o.tempo;if(o.seasons)S.seasons=clone(o.seasons);save();render();if(S.tempo)fetchTempo();return}
  if(d.tp){const[c,ty]=P(d.tp);S.tempoPrices[c][ty]=num(t.value);save();return}
  if(d.price){const[si,ty]=P(d.price);const s=S.seasons[+si];s.price=s.price||{};s.price[ty]=num(t.value);save();return}
  if(d.aname){A[+d.aname].name=t.value.trim()||'Appareil';save();return}
  if(d.apow){A[+d.apow].power=Math.max(0,num(t.value)||0);save();render();return}
  if(d.nodelay){A[+d.nodelay].noDelay=t.checked;save();render();return}
  if(d.amin){A[+d.amin].minDelay=Math.max(0,+t.value||0);save();return}
  if(d.amax){A[+d.amax].maxDelay=Math.max(1,+t.value||1);save();return}
  if(d.astep){A[+d.astep].step=+t.value;save();return}
  if(d.cname){const[ai,ci]=P(d.cname).map(Number);A[ai].cycles[ci].name=t.value.trim()||'Cycle';save();return}
  if(d.ckwh){const[ai,ci]=P(d.ckwh).map(Number),c=A[ai].cycles[ci],v=num(t.value);c.kwh=v>0?v:null;c.kwhSet=c.kwh!=null;save();render();return}
  if(d.ch||d.cm){const[ai,ci]=P(d.ch||d.cm).map(Number),c=A[ai].cycles[ci];
    const hh=d.ch?+t.value||0:Math.floor(c.dur/60),mm=d.cm?+t.value||0:c.dur%60;c.dur=Math.max(5,hh*60+Math.min(59,mm));save();render();return}
  if(d.sname){S.seasons[+d.sname].name=t.value;save();return}
  if(d.sfrom){S.seasons[+d.sfrom].from=t.value;S.offerId='custom';save();return}
  if(d.sto){S.seasons[+d.sto].to=t.value;S.offerId='custom';save();return}
  if(d.r){const[si,ty,ri,p]=P(d.r);S.seasons[+si][ty][+ri][+p]=t.value;S.offerId='custom';save();return}
});

setInterval(()=>{if(ui.tab==='calc'&&ui.timeMode==='phone'&&!document.activeElement.matches('input,select'))render()},30000);
applyTheme();applyColors();render();fetchTempo();
app.addEventListener('click',e=>{const b=e.target.closest('[data-unlock]');if(!b)return;e.stopPropagation();
  const v=(document.getElementById('unlockBox')||{}).value;
  tryUnlock(v).then(ok=>{ui.unlockMsg=ok?'':'Code non reconnu. Vérifie la saisie (exemple : AMI-7K3QP).';if(ok){applyColors();if(S.tempo)fetchTempo()}render()},()=>{ui.unlockMsg='Déblocage impossible sur ce navigateur. Ouvre l\'appli dans Safari ou Chrome.';render()})});
/* Lien direct : …/differe-malin/?code=AMI-XXXXX */
(()=>{let c=null;try{c=new URLSearchParams(location.search).get('code')}catch(e){}if(!c||BUILD_PRO)return;
  try{history.replaceState(null,'',location.pathname+location.hash)}catch(e){}
  tryUnlock(c).then(ok=>{if(ok){applyColors();render()}else{ui.tab='settings';ui.unlockMsg='Code du lien non reconnu.';render()}},()=>{})})();

/* ---- Achat intégré Google Play ---- */
let playService=null;
function setAchete(v){if(v===achete)return;achete=v;lsSet('achat',v?'1':'0');applyColors();if(v&&S.tempo)fetchTempo();render()}
function boutonAchat(){
  const note=ui.achatMsg?`<p class="note" role="status">${esc(ui.achatMsg)}</p>`:'';
  if(ui.achatDispo)return `<div class="row"><button class="btn primary" data-acheter ${ui.achatEnCours?'disabled':''}>${ui.achatEnCours?'Achat en cours…':'Passer à Pro · '+esc(ui.achatPrix||PRICE_LABEL)}</button><span class="note">Achat unique, sans abonnement.</span></div>${note}`;
  return `<div class="row"><a class="btn primary" href="${STORE_URL}" target="_blank" rel="noopener">Passer à Pro · ${PRICE_LABEL}</a><span class="note">Achat unique, sans abonnement.</span></div>
    <p class="note">L'achat se fait dans l'appli Différé Malin installée depuis Google Play (Android).</p>${note}`}
// Demande au serveur de confirmer l'achat. Renvoie 'ok', 'refus', 'attente' ou 'reseau'.
async function verifierAchat(jeton){if(!VERIF_URL)return 'reseau';
  try{const r=await fetch(VERIF_URL,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({app:PLAY_APP,produit:PLAY_PRODUIT,jeton})});
    const j=await r.json().catch(()=>({}));if(j.ok)return 'ok';if(j.raison==='attente')return 'attente';
    if(j.raison==='annule'||j.raison==='inconnu')return 'refus';return 'reseau'}catch(e){return 'reseau'}}
async function initAchat(){
  if(!VERIF_URL||!('getDigitalGoodsService' in window))return;
  try{playService=await window.getDigitalGoodsService(PLAY_BILLING)}catch(e){return}
  if(!playService)return;
  ui.achatDispo=true;
  try{const [d]=await playService.getDetails([PLAY_PRODUIT]);
    if(d&&d.price)ui.achatPrix=new Intl.NumberFormat('fr-FR',{style:'currency',currency:d.price.currency}).format(d.price.value)}catch(e){}
  // Achats déjà faits avec ce compte Google (nouveau téléphone, réinstallation, remboursement)
  try{const achats=await playService.listPurchases();const p=achats.find(x=>x.itemId===PLAY_PRODUIT);
    if(p){setAchete(true);verifierAchat(p.purchaseToken)} // la confirmation est refaite au cas où elle aurait échoué
    else setAchete(false)}catch(e){}
  render()}
async function acheter(){if(!playService||ui.achatEnCours)return;
  ui.achatMsg='';ui.achatEnCours=true;render();
  try{const req=new PaymentRequest([{supportedMethods:PLAY_BILLING,data:{sku:PLAY_PRODUIT}}],{total:{label:'Total',amount:{currency:'EUR',value:'0'}}});
    const rep=await req.show();const jeton=rep.details&&rep.details.purchaseToken;
    const res=jeton?await verifierAchat(jeton):'refus';
    if(res==='ok'){await rep.complete('success');setAchete(true);ui.achatMsg='Merci ! Toutes les fonctions Pro sont débloquées.'}
    else if(res==='reseau'){await rep.complete('success');setAchete(true);ui.achatMsg='Achat enregistré. La confirmation sera refaite à la prochaine ouverture avec Internet.'}
    else if(res==='attente'){await rep.complete('success');ui.achatMsg='Paiement en attente chez Google. La Pro se débloquera dès qu\'il sera validé.'}
    else{await rep.complete('fail');ui.achatMsg='Achat non validé par Google Play. Si tu as été débité, Google te rembourse automatiquement sous quelques jours.'}
  }catch(e){ui.achatMsg=e&&e.name==='AbortError'?'':'Achat impossible pour le moment. Réessaie plus tard.'}
  ui.achatEnCours=false;render()}
app.addEventListener('click',e=>{
  if(e.target.closest('[data-acheter]')){e.stopPropagation();acheter();return}
  if(e.target.closest('[data-voirpro]')){e.stopPropagation();const c=document.getElementById('pro-card');if(c)c.scrollIntoView({behavior:matchMedia('(prefers-reduced-motion: reduce)').matches?'auto':'smooth'});else{ui.tab='appl';render();window.scrollTo(0,0)}}});
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&playService)initAchat()});
initAchat();
</script>
